<!-- @dsCard group="Transitions" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>View Transitions swap · Attention Lab</title>
<style>
:root{--bg:#08080d;--bg-elev:#10101a;--ink:#f4f3f7;--ink-dim:#8f8ea0;--accent:#7c5cff;--accent-2:#29e6a7;--hot:#ff4d6d;--gold:#ffb74d;--line:rgba(244,243,247,.09);--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease-out:cubic-bezier(.16,1,.3,1);--ease-snap:cubic-bezier(.2,0,0,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:34px 18px 22px}
.card-label{position:fixed;top:10px;left:14px;font:10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.grid{display:grid;grid-template-columns:repeat(4,64px);gap:10px}
.chip{height:64px;border-radius:14px;display:grid;place-items:center;font:700 15px var(--mono);color:#0a0a10}
.go{margin-top:18px;background:#6f4dff;color:#fff;border:none;border-radius:999px;font:600 13.5px var(--sans);padding:11px 22px;cursor:pointer}
.note{margin-top:10px;font:10.5px var(--mono);letter-spacing:.08em;color:var(--ink-dim)}
::view-transition-group(*){animation-duration:.45s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
</style></head>
<body>
<span class="card-label">View Transitions swap</span>
<div><div class="grid" id="grid"></div>
<button class="go" id="go">Shuffle</button><div class="note" id="note"></div></div>
<script>
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLORS=["#7c5cff","#29e6a7","#ffb74d","#ff4d6d","#5c8aff","#d98aff","#8fe388","#f4f3f7"];
const grid=document.getElementById("grid");
COLORS.forEach((c,i)=>{const d=document.createElement("div");d.className="chip";d.textContent=i+1;
d.style.background=c;d.style.viewTransitionName="chip-"+i;grid.appendChild(d);});
function shuffle(){[...grid.children].map(c=>({c,r:Math.random()})).sort((a,b)=>a.r-b.r).forEach(({c})=>grid.appendChild(c));}
const native=!!document.startViewTransition;
document.getElementById("note").textContent=native?"Native View Transitions API (Baseline 2025)":"View Transitions unsupported here — instant reorder fallback";
document.getElementById("go").addEventListener("click",()=>{
if(RM||!native){shuffle();return}
document.startViewTransition(shuffle);});
</script>
</body></html>
