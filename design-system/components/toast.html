<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast stack · Attention Lab</title>
<style>
:root{--bg:#08080d;--bg-elev:#10101a;--ink:#f4f3f7;--ink-dim:#8f8ea0;--accent:#7c5cff;--accent-2:#29e6a7;--hot:#ff4d6d;--gold:#ffb74d;--line:rgba(244,243,247,.09);--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease-out:cubic-bezier(.16,1,.3,1);--ease-snap:cubic-bezier(.2,0,0,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:34px 18px 22px}
.card-label{position:fixed;top:10px;left:14px;font:10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.fire{background:#6f4dff;color:#fff;border:none;border-radius:999px;font:600 14px var(--sans);padding:12px 26px;cursor:pointer}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column-reverse;gap:10px;width:min(300px,80vw)}
.toast{background:rgba(23,23,37,.94);border:1px solid var(--line);border-left:3px solid var(--tone,var(--accent));border-radius:12px;padding:13px 15px 15px;transform:translateX(120%);transition:transform .5s var(--ease-bounce),opacity .25s ease;position:relative;overflow:hidden}
.toast.in{transform:translateX(0)}.toast.out{transform:scale(.92);opacity:0;transition:all .25s ease}
.toast b{font-size:13.5px;display:block;padding-right:24px}.toast p{margin:2px 0 0;font-size:12.5px;color:var(--ink-dim)}
.tc{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--ink-dim);cursor:pointer;font:13px var(--sans);padding:6px;border-radius:6px}.tc:hover{color:var(--ink)}
.bar{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--tone,var(--accent));transform-origin:left;animation:tt var(--life,4200ms) linear forwards}
.toast:hover .bar,.toast:focus-within .bar{animation-play-state:paused}
@keyframes tt{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){.toast{transform:none;opacity:0;transition:opacity .15s ease}.toast.in{opacity:1}.bar{animation-duration:var(--life,4200ms)!important}}
</style></head>
<body>
<span class="card-label">Toast stack</span>
<button class="fire" id="fire">Fire toast</button>
<div class="toasts" id="toasts" role="region" aria-live="polite" aria-label="Notifications"></div>
<script>
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MSGS=[["Deploy · production","relay-web@4.12 live in 3 regions.","var(--accent-2)"],["Mara Voss","Shipping the motion spec today.","var(--accent)"],["Incident — p95","eu-west checkout above 900ms.","var(--hot)"],["Milestone","10,000 workspaces.","var(--gold)"]];
let i=0;const box=document.getElementById("toasts");
function dismiss(t){if(!t||t.classList.contains("out"))return;t.classList.remove("in");t.classList.add("out");setTimeout(()=>t.remove(),300);}
document.getElementById("fire").addEventListener("click",()=>{const[ti,bo,tn]=MSGS[i++%4];
const t=document.createElement("div");t.className="toast";t.style.setProperty("--tone",tn);
t.innerHTML="<b>"+ti+"</b><p>"+bo+"</p><button class=\"tc\" aria-label=\"Dismiss\">✕</button><span class=\"bar\"></span>";
box.appendChild(t);requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add("in")));
t.querySelector(".bar").addEventListener("animationend",()=>dismiss(t));
t.querySelector(".tc").addEventListener("click",()=>dismiss(t));
if(box.children.length>3)dismiss(box.children[0]);});
</script>
</body></html>
