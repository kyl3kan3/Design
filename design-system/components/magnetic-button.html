<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic button · Attention Lab</title>
<style>
:root{--bg:#08080d;--bg-elev:#10101a;--ink:#f4f3f7;--ink-dim:#8f8ea0;--accent:#7c5cff;--accent-2:#29e6a7;--hot:#ff4d6d;--gold:#ffb74d;--line:rgba(244,243,247,.09);--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease-out:cubic-bezier(.16,1,.3,1);--ease-snap:cubic-bezier(.2,0,0,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:34px 18px 22px}
.card-label{position:fixed;top:10px;left:14px;font:10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.zone{display:grid;place-items:center;width:320px;height:170px}
.btn{position:relative;overflow:hidden;background:#6f4dff;border:none;color:#fff;cursor:pointer;font:600 15px var(--sans);padding:16px 34px;border-radius:999px;will-change:transform;transition:box-shadow .3s ease}
.btn:hover{box-shadow:0 8px 32px rgba(124,92,255,.45)}
.btn .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-110%)}
.btn:hover .shine{transform:translateX(110%);transition:transform .65s ease}
.btn .inner{position:relative;display:inline-block;will-change:transform}
</style></head>
<body>
<span class="card-label">Magnetic button</span>
<div class="zone" id="zone"><button class="btn" id="btn"><span class="shine"></span><span class="inner">Start free trial</span></button></div>
<script>
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!RM){const zone=document.getElementById("zone"),btn=document.getElementById("btn"),inner=btn.querySelector(".inner");
let tx=0,ty=0,x=0,y=0,run=false;
function loop(){x+=(tx-x)*.12;y+=(ty-y)*.12;btn.style.transform="translate("+x+"px,"+y+"px)";inner.style.transform="translate("+x*.35+"px,"+y*.35+"px)";
if(Math.abs(tx-x)>.1||Math.abs(ty-y)>.1)requestAnimationFrame(loop);else{run=false;x=tx;y=ty;}}
function kick(){if(!run){run=true;requestAnimationFrame(loop)}}
zone.addEventListener("pointermove",e=>{const r=btn.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
if(Math.hypot(dx,dy)<120){tx=dx*.35;ty=dy*.35}else{tx=0;ty=0}kick();});
zone.addEventListener("pointerleave",()=>{tx=0;ty=0;kick();});}
</script>
</body></html>
