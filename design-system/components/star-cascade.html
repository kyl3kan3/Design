<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star cascade · Attention Lab</title>
<style>
:root{--bg:#08080d;--bg-elev:#10101a;--ink:#f4f3f7;--ink-dim:#8f8ea0;--accent:#7c5cff;--accent-2:#29e6a7;--hot:#ff4d6d;--gold:#ffb74d;--line:rgba(244,243,247,.09);--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease-out:cubic-bezier(.16,1,.3,1);--ease-snap:cubic-bezier(.2,0,0,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:34px 18px 22px}
.card-label{position:fixed;top:10px;left:14px;font:10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.stars{display:flex;gap:6px}
.s{background:none;border:none;cursor:pointer;padding:4px}
.s svg{width:30px;height:30px;fill:#23233a;stroke:var(--ink-dim);stroke-width:1;transition:fill .15s ease;display:block}
.s.lit svg{fill:var(--gold);stroke:var(--gold)}
.s.pop{animation:sp .35s var(--ease-bounce)}@keyframes sp{50%{transform:scale(1.35) rotate(8deg)}}
</style></head>
<body>
<span class="card-label">Star cascade</span>
<div class="stars" id="stars" role="radiogroup" aria-label="Rate"><button class="s" role="radio" aria-checked="false" aria-label="1 star"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg></button><button class="s" role="radio" aria-checked="false" aria-label="2 star"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg></button><button class="s" role="radio" aria-checked="false" aria-label="3 star"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg></button><button class="s" role="radio" aria-checked="false" aria-label="4 star"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg></button><button class="s" role="radio" aria-checked="false" aria-label="5 star"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg></button></div>
<script>
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stars=[...document.querySelectorAll(".s")];let pend=[];
function sel(i){pend.forEach(clearTimeout);pend=[];stars.forEach((s,j)=>{s.classList.remove("pop");s.setAttribute("aria-checked",String(j===i));s.tabIndex=j===i?0:-1;
if(j<=i){pend.push(setTimeout(()=>{s.classList.add("lit");if(!RM){void s.offsetWidth;s.classList.add("pop")}},RM?0:j*60))}else s.classList.remove("lit");});}
stars.forEach((s,i)=>{s.tabIndex=i===0?0:-1;s.addEventListener("click",()=>sel(i));
s.addEventListener("keydown",e=>{let n=null;if(e.key==="ArrowRight"||e.key==="ArrowUp")n=Math.min(i+1,4);if(e.key==="ArrowLeft"||e.key==="ArrowDown")n=Math.max(i-1,0);
if(n!==null){e.preventDefault();stars[n].focus();sel(n)}});});
</script>
</body></html>
